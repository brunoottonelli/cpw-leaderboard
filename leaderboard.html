<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Leaderboard - Calistenia</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.4/dist/svg2pdf.umd.min.js"></script>
  <script src="criterios.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0f14;
      --card: #171a22;
      --line: #2a2f3b;
      --tx: #eef0f4;
      --mute: #9aa1b0;
      --acc: #ff8a2a;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      padding: 24px 20px
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      gap: 22px
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    h1 {
      font-size: 22px;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    h1 span {
      color: var(--acc)
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px 24px
    }

    .header-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--mute);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      white-space: nowrap;
      line-height: 1;
      transform: translateY(-0.5px);
    }

    /* Custom Dropdowns */
    .custom-select,
    .export-dropdown {
      position: relative;
    }

    .custom-select-btn {
      background: #171a22;
      color: var(--tx);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      height: 34px;
      box-sizing: border-box;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      line-height: 1;
      user-select: none;
      transition: border-color .15s ease, background-color .15s ease, box-shadow .15s ease;
    }

    .custom-select-btn:hover {
      border-color: #4a5468;
      background-color: #1b1f29;
    }

    .custom-select-btn:focus-visible,
    .custom-select-btn[aria-expanded="true"] {
      border-color: var(--acc);
      box-shadow: 0 0 0 2px rgba(255, 138, 42, 0.2);
    }

    .custom-select-val {
      line-height: 1;
      display: inline-block;
      transform: translateY(-0.5px);
    }

    .custom-select-btn .chevron {
      width: 12px;
      height: 12px;
      fill: none;
      stroke: var(--acc);
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform .2s ease;
      flex-shrink: 0;
    }

    .custom-select-btn[aria-expanded="true"] .chevron {
      transform: rotate(180deg);
    }

    .custom-select-menu,
    .export-menu {
      position: absolute;
      top: calc(100% + 6px);
      background: #171a22;
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.55);
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 4px;
      z-index: 100;
    }

    .custom-select-menu {
      left: 0;
      min-width: 100%;
      max-height: 280px;
      overflow-y: auto;
    }

    .export-menu {
      right: 0;
      min-width: 150px;
    }

    .custom-select-menu.show,
    .export-menu.show {
      display: flex;
    }

    .custom-select-menu::-webkit-scrollbar {
      width: 6px;
    }

    .custom-select-menu::-webkit-scrollbar-thumb {
      background: #2a303f;
      border-radius: 3px;
    }

    .custom-select-menu::-webkit-scrollbar-thumb:hover {
      background: var(--acc);
    }

    .custom-select-option,
    .export-menu button {
      background: transparent;
      border: none;
      color: var(--tx);
      border-radius: 6px;
      padding: 8px 12px;
      text-align: left;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      white-space: nowrap;
      transition: background .15s ease, color .15s ease;
    }

    .custom-select-option:hover,
    .export-menu button:hover {
      background: #252b38;
      color: var(--acc);
    }

    .custom-select-option.active {
      background: rgba(255, 138, 42, 0.14);
      color: var(--acc);
      font-weight: 700;
    }

    .custom-select-option.active::after {
      content: "✓";
      font-size: 12px;
      font-weight: 800;
      color: var(--acc);
    }

    .toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--tx);
      cursor: pointer;
      user-select: none;
      background: #171a22;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      height: 34px;
      box-sizing: border-box;
      line-height: 1;
      transition: border-color .15s ease, background-color .15s ease;
    }

    .toggle-label:hover {
      border-color: #4a5468;
      background-color: #1b1f29;
    }

    .toggle-label input {
      accent-color: var(--acc);
      width: 15px;
      height: 15px;
      margin: 0;
      cursor: pointer;
      display: block;
      flex-shrink: 0;
    }

    .toggle-label span {
      line-height: 1;
      display: inline-block;
      transform: translateY(-0.5px);
    }

    .btn-export {
      background: var(--acc);
      color: #1a1005;
      border: 1px solid var(--acc);
      border-radius: 8px;
      padding: 0 13px;
      height: 34px;
      box-sizing: border-box;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      line-height: 1;
      transition: background .15s ease, border-color .15s ease;
    }

    .btn-export:hover {
      background: #ff9a47;
      border-color: #ff9a47;
    }

    .btn-export svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .btn-export span {
      line-height: 1;
      display: inline-block;
      transform: translateY(-0.5px);
    }

    .export-menu button span.ext {
      font-size: 11px;
      color: var(--mute);
      text-transform: uppercase;
      font-weight: 600;
    }

    .prev {
      overflow-x: auto;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 16px
    }

    .prev svg {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px
    }

    .svg-mode-btn {
      cursor: pointer;
      user-select: none;
      transition: opacity .15s ease
    }

    .svg-mode-btn:hover {
      opacity: .82
    }

    .svg-expand-btn {
      cursor: pointer;
      user-select: none;
      transition: opacity .15s ease, filter .15s ease;
    }

    .svg-expand-btn:hover {
      opacity: .88;
      filter: brightness(1.18);
    }

    .status-msg {
      text-align: center;
      padding: 50px 20px;
      color: var(--mute);
      font-size: 15px
    }

    .status-msg.error {
      color: #ff6b6b
    }

    .status-msg.loading {
      color: var(--acc);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--line);
      border-top-color: var(--acc);
      border-radius: 50%;
      animation: spin .8s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @media(max-width:750px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .header-controls {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="header">
      <h1>🏆 <span>CPW</span> LEADERBOARD</h1>

      <div class="header-controls">
        <div class="header-item">
          <span class="header-label">Período:</span>
          <div class="custom-select" id="periodCustomSelect">
            <button type="button" class="custom-select-btn" id="periodBtn" aria-haspopup="listbox" aria-expanded="false" title="Seleccionar período">
              <span class="custom-select-val" id="periodVal">Cargando...</span>
              <svg class="chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="custom-select-menu" id="periodMenu" role="listbox"></div>
          </div>
          <select id="periodSelect" style="display:none;"></select>
        </div>

        <div class="header-item">
          <span class="header-label">Grupo:</span>
          <div class="custom-select" id="groupCustomSelect">
            <button type="button" class="custom-select-btn" id="groupBtn" aria-haspopup="listbox" aria-expanded="false" title="Seleccionar grupo">
              <span class="custom-select-val" id="groupVal">Todos los grupos</span>
              <svg class="chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="custom-select-menu" id="groupMenu" role="listbox"></div>
          </div>
          <select id="groupSelect" style="display:none;"></select>
        </div>

        <label class="toggle-label" title="Mostrar u ocultar profesores">
          <input type="checkbox" id="profeCheck" checked>
          <span>Profesores</span>
        </label>

        <label class="toggle-label" title="Mostrar u ocultar grupos">
          <input type="checkbox" id="groupBadgeCheck">
          <span>Mostrar grupos</span>
        </label>

        <div class="export-dropdown">
          <button class="btn-export" id="exportBtn" type="button" aria-haspopup="true" aria-expanded="false"
            title="Exportar leaderboard">
            <svg viewBox="0 0 24 24">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" />
            </svg>
            <span>Exportar</span>
          </button>
          <div class="export-menu" id="exportMenu">
            <button type="button" id="pdfBtn">
              <span>Documento</span>
              <span class="ext">PDF</span>
            </button>
            <button type="button" id="pngBtn">
              <span>Imagen</span>
              <span class="ext">PNG</span>
            </button>
            <button type="button" id="svgBtn">
              <span>Vector</span>
              <span class="ext">SVG</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="card prev" id="prev">
      <div class="status-msg loading">
        <div class="spinner"></div>
        <span>Cargando leaderboard...</span>
      </div>
    </div>
  </div>

  <script>
    const COLORS = ['#ff8a2a', '#818cf8', '#2dd4bf', '#38bdf8'];
    const MEDAL = { 1: '#f5c542', 2: '#c9ced6', 3: '#cd7f32' };
    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    function formatGroup(g) {
      if (!g) return '';
      const s = String(g).trim();
      const m = s.match(/^([a-zA-ZáéíóúÁÉÍÓÚñÑ]+)\s*(\d{1,4})$/);
      if (m) {
        const letters = m[1].toUpperCase();
        let num = m[2];
        if (num.length === 4) num = `${num.slice(0, 2)}:${num.slice(2)}`;
        else if (num.length === 3) num = `0${num.slice(0, 1)}:${num.slice(1)}`;
        else if (num.length <= 2) num = `${num}:00`;
        return `${letters} ${num}`;
      }
      return s;
    }

    let availablePeriods = [];
    let exercisesConfig = [];
    let currentRecord = null;
    let currentPeriod = '';
    let currentGroup = 'all';
    let currentGmode = 'pos';
    let curSvg = null;
    const ROW_LIMIT = 10;
    let isExpanded = false;

    // Embedded fallback data in case local file:// blocks fetch
    const FALLBACK_EXERCISES = {
      "exercises": [
        { "id": "dominadas_pronas", "name": "Dominadas pronas" },
        { "id": "fondos", "name": "Fondos en paralelas" },
        { "id": "lagartijas", "name": "Lagartijas" },
        { "id": "dominadas_supinas", "name": "Dominadas supinas" }
      ]
    };

    const FALLBACK_PERIODS = [
      { "id": "2026-10", "nombre": "Octubre 2026" }
    ];

    const FALLBACK_RECORD = {
      "period": "2026-10",
      "name": "Octubre 2026",
      "athletes": [
        { "name": "Fabri", "grupo": "LMV1730", "fecha": "2026-10-19", "es_profe": true, "results": { "dominadas_pronas": 27, "fondos": 43, "lagartijas": 40, "dominadas_supinas": 21 } },
        { "name": "Tadeo", "grupo": "LMV1730", "fecha": "2026-10-19", "es_profe": false, "results": { "dominadas_pronas": 17, "fondos": 17, "lagartijas": 28, "dominadas_supinas": 16 } },
        { "name": "Lucía", "grupo": "LMV1730", "fecha": "2026-10-19", "es_profe": false, "results": { "dominadas_pronas": 14, "fondos": 12, "lagartijas": 40, "dominadas_supinas": 13 } },
        { "name": "Joaquín", "grupo": "LMV1730", "fecha": "2026-10-19", "es_profe": false, "results": { "dominadas_pronas": 13, "fondos": 11, "lagartijas": 14, "dominadas_supinas": 12 } },
        { "name": "Maxi", "grupo": "LMV1730", "fecha": "2026-10-19", "es_profe": false, "results": { "dominadas_pronas": 13, "fondos": 23, "lagartijas": 41, "dominadas_supinas": 10 } },
        { "name": "S", "grupo": "LMV1730", "fecha": "2026-10-19", "es_profe": false, "results": { "dominadas_pronas": 12, "fondos": 17, "lagartijas": 36, "dominadas_supinas": 13 } },
        { "name": "Ro", "grupo": "LMV1730", "fecha": "2026-10-19", "es_profe": false, "results": { "dominadas_pronas": 11, "fondos": 17, "lagartijas": 33, "dominadas_supinas": 11 } },
        { "name": "Bruno", "grupo": "LMV1730", "fecha": "2026-10-19", "es_profe": false, "results": { "dominadas_pronas": 11, "fondos": 18, "lagartijas": 40, "dominadas_supinas": 9 } },
        { "name": "Tony", "grupo": "LMV1730", "fecha": "2026-10-19", "es_profe": false, "results": { "dominadas_pronas": 9, "fondos": 18, "lagartijas": 24, "dominadas_supinas": 10 } }
      ]
    };

    function updateGroupFilter(athletes) {
      const groupSelect = $('groupSelect');
      const groupMenu = $('groupMenu');

      const groups = Array.from(
        new Set((athletes || []).map(a => a.grupo).filter(g => g && String(g).trim() !== ''))
      ).sort();

      const prevGroup = currentGroup;
      if (groupSelect) groupSelect.innerHTML = '<option value="all">Todos los grupos</option>';
      if (groupMenu) groupMenu.innerHTML = '';

      const items = [{ id: 'all', name: 'Todos los grupos' }];
      groups.forEach(g => {
        items.push({ id: g, name: formatGroup(g) });
      });

      items.forEach(item => {
        if (groupSelect) {
          const opt = document.createElement('option');
          opt.value = item.id;
          opt.textContent = item.name;
          groupSelect.appendChild(opt);
        }
        if (groupMenu) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'custom-select-option' + (item.id === currentGroup ? ' active' : '');
          btn.dataset.value = item.id;
          btn.textContent = item.name;
          btn.addEventListener('click', () => {
            selectGroup(item.id);
          });
          groupMenu.appendChild(btn);
        }
      });

      if (groups.includes(prevGroup)) {
        selectGroup(prevGroup);
      } else {
        selectGroup('all');
      }
    }

    function selectGroup(groupId) {
      currentGroup = groupId;
      isExpanded = false;
      if ($('groupSelect')) $('groupSelect').value = groupId;
      const groupVal = $('groupVal');
      if (groupVal) {
        groupVal.textContent = groupId === 'all' ? 'Todos los grupos' : formatGroup(groupId);
      }
      if ($('groupMenu')) {
        Array.from($('groupMenu').children).forEach(btn => {
          btn.classList.toggle('active', btn.dataset.value === groupId);
        });
        $('groupMenu').classList.remove('show');
        if ($('groupBtn')) $('groupBtn').setAttribute('aria-expanded', 'false');
      }
      render();
    }

    function splitLeadingEmoji(str) {
      const s = String(str || '').trim();
      if (!s) return { em: '', text: '' };
      const m = s.match(/^(\p{Extended_Pictographic}\uFE0F?)\s*/u);
      if (m) return { em: m[1], text: s.slice(m[0].length) };
      return { em: '', text: s };
    }

    function parseNum(val) {
      if (val === undefined || val === null) return NaN;
      const clean = String(val).trim().replace(',', '.');
      if (clean === '') return NaN;
      const m = clean.match(/-?\d+(\.\d+)?/);
      return m ? parseFloat(m[0]) : NaN;
    }

    function icon(h, x, y, col) {
      const k = h.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      const g = `<g transform="translate(${x},${y})" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">`;
      const dumb = g + '<path d="M10 20H30M10 11V29M30 11V29M5 15V25M35 15V25"/></g>';
      if (/pesa|press|curl/.test(k)) return dumb;
      if (/domin|pull|barra/.test(k)) return g + '<path d="M3 6H37M7 6V37M33 6V37"/></g>';
      if (/fondo|dip|paralela/.test(k)) {
        const gPar = `<g transform="translate(${x},${y})" fill="none" stroke="${col}" stroke-linecap="round" stroke-linejoin="round">`;
        return gPar + '<path d="M14 9H36M18 9V28M32 9V28" stroke-width="2.4" stroke-opacity="0.65"/><path d="M5 17H27M9 17V36M23 17V36" stroke-width="2.6"/></g>';
      }
      if (/lagart|flexion|push|plancha/.test(k)) return g + '<circle cx="8" cy="15" r="3.5"/><path d="M13 19L35 27M15 21V33M3 35H38"/></g>';
      return dumb;
    }

    function wrap(h) {
      if (h.length <= 14 || !h.includes(' ')) return [h];
      const mid = h.length / 2;
      let best = -1;
      for (let i = 0; i < h.length; i++) {
        if (h[i] === ' ' && (best < 0 || Math.abs(i - mid) < Math.abs(best - mid))) best = i;
      }
      return [h.slice(0, best), h.slice(best + 1)];
    }

    function splitMid(h) {
      const parts = h.split(/\s+/);
      if (parts.length < 2) return [h];
      const mid = h.length / 2;
      let acc = 0, cut = 1;
      for (let i = 0; i < parts.length - 1; i++) {
        acc += parts[i].length + 1;
        if (acc <= mid + 2) cut = i + 1;
      }
      return [parts.slice(0, cut).join(' '), parts.slice(cut).join(' ')];
    }

    let _measureCtx = null;
    function getTextWidth(text, font) {
      try {
        if (!_measureCtx) {
          const c = document.createElement('canvas');
          _measureCtx = c.getContext('2d');
        }
        if (_measureCtx) {
          _measureCtx.font = font;
          return _measureCtx.measureText(text).width;
        }
      } catch (e) {}
      return (text || '').length * 9.5;
    }

    function wrapText(text, maxW, font) {
      if (!text) return [];
      // Dividir por párrafos (doble salto de línea: \n\n)
      const paragraphs = String(text).split(/\n\s*\n/);
      const result = [];
      paragraphs.forEach((p, pIdx) => {
        // Dentro de cada párrafo puede haber saltos de línea simples (\n)
        const subLines = p.split('\n');
        let firstLineInPara = true;
        subLines.forEach(lineText => {
          const words = lineText.trim().split(/\s+/);
          if (words.length === 0 || words[0] === '') return;
          let curLine = words[0];
          const wrapped = [];
          for (let i = 1; i < words.length; i++) {
            const testLine = curLine + ' ' + words[i];
            if (getTextWidth(testLine, font) <= maxW) {
              curLine = testLine;
            } else {
              wrapped.push(curLine);
              curLine = words[i];
            }
          }
          if (curLine) wrapped.push(curLine);
          wrapped.forEach(wLine => {
            result.push({ text: wLine, isNewParagraph: firstLineInPara && pIdx > 0 });
            firstLineInPara = false;
          });
        });
      });
      return result;
    }

    function buildSvg(recordData, exercisesData, periodStr, groupFilter, isExport = false, expanded = isExpanded, page = 'all') {
      if (!recordData || !recordData.athletes || !recordData.athletes.length) return null;

      const includeProfe = $('profeCheck').checked;
      const includeGroupBadges = $('groupBadgeCheck') ? $('groupBadgeCheck').checked : false;
      const selectedGroup = groupFilter !== undefined ? groupFilter : currentGroup;

      const filteredAthletes = recordData.athletes.filter(a => {
        if (!includeProfe && a.es_profe) return false;
        if (selectedGroup !== 'all' && a.grupo !== selectedGroup) return false;
        return true;
      });
      if (!filteredAthletes.length) return null;

      // Determine exercises to display
      const exerciseDefs = (exercisesData && exercisesData.exercises) ? exercisesData.exercises : [];
      const exerciseMap = new Map(exerciseDefs.map(e => [e.id, e.name]));

      // Find all exercise IDs actually present in athletes' results
      const exerciseIds = [];
      exerciseDefs.forEach(e => {
        if (filteredAthletes.some(a => a.results && a.results[e.id] !== undefined && a.results[e.id] !== null)) {
          exerciseIds.push(e.id);
        }
      });
      filteredAthletes.forEach(a => {
        if (a.results) {
          Object.keys(a.results).forEach(id => {
            if (!exerciseIds.includes(id) && a.results[id] !== undefined && a.results[id] !== null) {
              exerciseIds.push(id);
            }
          });
        }
      });

      const cols = [];
      exerciseIds.forEach(id => {
        const h = exerciseMap.get(id) || id.replace(/_/g, ' ');
        const list = filteredAthletes.map(a => ({
          n: a.name,
          grupo: a.grupo || '',
          fecha: a.fecha || '',
          es_profe: !!a.es_profe,
          v: parseNum(a.results ? a.results[id] : undefined)
        })).filter(x => x.n && !isNaN(x.v));

        list.sort((a, b) => b.v - a.v);
        list.forEach((x, k) => {
          x.r = (k && list[k - 1].v === x.v) ? list[k - 1].r : k + 1;
        });

        if (list.length > 0) {
          cols.push({ id, h, list });
        }
      });

      if (!cols.length) return null;

      const CW = 250, GAP = 24, PAD = 36, RH = 58, PER = 4;
      const n = Math.min(cols.length, PER);
      const W = Math.max(750, PAD * 2 + n * CW + (n - 1) * GAP);
      let y = 0, body = '';

      const baseLabel = (recordData && (recordData.nombre || recordData.name)) ? (recordData.nombre || recordData.name) : (periodStr || '');
      let periodLabel = baseLabel ? `${baseLabel}` : '';
      if (selectedGroup !== 'all') {
        const formattedSelGroup = formatGroup(selectedGroup);
        periodLabel = periodLabel ? `${periodLabel} · GRUPO: ${formattedSelGroup}` : `GRUPO: ${formattedSelGroup}`;
      } else if (recordData && recordData.athletes && recordData.athletes.some(a => a.grupo)) {
        periodLabel = periodLabel ? `${periodLabel} · TODOS LOS GRUPOS` : 'TODOS LOS GRUPOS';
      }

      // --- 1. COLUMNAS DE LAS CATEGORÍAS INDIVIDUALES ---
      if (page !== 'general') {
        y = periodLabel ? 172 : 154;
        const chunks = [];
        for (let i = 0; i < cols.length; i += PER) chunks.push(cols.slice(i, i + PER));

        const maxExercisesAthletes = Math.max(...cols.map(c => c.list.length), 1);
        const hasMoreExercises = maxExercisesAthletes > ROW_LIMIT;

        chunks.forEach((ch, ci) => {
          const totalInChunk = Math.max(...ch.map(c => c.list.length), 1);
          const mx = expanded ? totalInChunk : Math.min(totalInChunk, ROW_LIMIT);
          const ph = 84 + mx * RH + 10;
          const tw = ch.length * CW + (ch.length - 1) * GAP;
          const x0 = (W - tw) / 2;

          ch.forEach((c, k) => {
            const x = x0 + k * (CW + GAP);
            const col = COLORS[(ci * PER + k) % 4];
            body += `<rect x="${x}" y="${y}" width="${CW}" height="${ph}" rx="16" fill="#000" fill-opacity=".38" stroke="${col}" stroke-width="2.5"/>`;

            const sp = splitLeadingEmoji(c.h);
            const label = sp.text;
            body += sp.em
              ? `<text x="${x + 34}" y="${y + 45}" text-anchor="middle" font-size="30">${esc(sp.em)}</text>`
              : icon(c.h, x + 14, y + 14, col);

            const hl = wrap(label.toUpperCase());
            hl.forEach((t, j) => {
              body += `<text x="${x + 62}" y="${y + (hl.length > 1 ? 34 + j * 22 : 46)}" text-anchor="start" font-size="19" font-weight="800" font-style="italic" fill="#fff">${esc(t)}</text>`;
            });

            const displayList = expanded ? c.list : c.list.slice(0, ROW_LIMIT);

            displayList.forEach((p, j) => {
              const yy = y + 76 + j * RH;
              const bx = x + 60;
              if (p.r <= 3) {
                body += `<circle cx="${x + 34}" cy="${yy + 25}" r="19" fill="${MEDAL[p.r]}" stroke="#fff" stroke-opacity=".5"/><text x="${x + 34}" y="${yy + 33}" text-anchor="middle" font-size="22" font-weight="800" fill="#1b1b1b">${p.r}</text>`;
              } else {
                body += `<text x="${x + 34}" y="${yy + 34}" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">${p.r}º</text>`;
              }

              const hi = p.r <= 3;
              body += `<rect x="${bx}" y="${yy}" width="176" height="50" rx="8" fill="#1a1d26" stroke="${hi ? col : '#3a4050'}" stroke-width="${hi ? 2 : 1.5}"/>`;
              body += `<rect x="${bx + 120}" y="${yy + 1}" width="55" height="48" rx="7" fill="#07080b"/>`;

              const showGroup = includeGroupBadges && Boolean(p.grupo);
              const nameY = showGroup ? yy + 22 : yy + 31.5;
              const fs = showGroup
                ? (p.es_profe ? (p.n.length > 8 ? 12 : p.n.length > 5 ? 13.5 : 15) : (p.n.length > 8 ? 13.5 : p.n.length > 5 ? 15 : 17))
                : (p.es_profe ? (p.n.length > 8 ? 13.5 : p.n.length > 5 ? 16 : 18) : (p.n.length > 8 ? 15 : p.n.length > 5 ? 18 : 22));

              if (p.es_profe) {
                const nw = getTextWidth(p.n, `800 ${fs}px 'Segoe UI', Arial, sans-serif`);
                const pSize = 18;
                const pGap = 6;
                const totalW = pSize + pGap + nw;
                const startX = Math.max(bx + 4, bx + 60 - totalW / 2);
                const pX = startX;
                const pCenterY = nameY - fs * 0.35;
                const pY = pCenterY - pSize / 2;
                body += `<rect x="${pX}" y="${pY}" width="${pSize}" height="${pSize}" rx="4" fill="#ff8a2a" fill-opacity=".18" stroke="#ff8a2a" stroke-width="1.3" stroke-opacity=".85"/>`;
                body += `<text x="${pX + pSize / 2}" y="${pY + 13}" text-anchor="middle" font-size="11.5" font-weight="900" fill="#ff9a47">P</text>`;
                const nameX = pX + pSize + pGap;
                body += `<text x="${nameX}" y="${nameY}" text-anchor="start" font-size="${fs}" font-weight="800" fill="#fff">${esc(p.n)}</text>`;
              } else {
                body += `<text x="${bx + 60}" y="${nameY}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="#fff">${esc(p.n)}</text>`;
              }

              if (showGroup) {
                const groupTxt = formatGroup(p.grupo);
                body += `<text x="${bx + 60}" y="${yy + 37}" text-anchor="middle" font-size="10.5" font-weight="600" fill="#9aa1b0" letter-spacing="0.3">${esc(groupTxt)}</text>`;
              }
              body += `<text x="${bx + 148}" y="${yy + 34}" text-anchor="middle" font-size="26" font-weight="800" fill="${col}">${esc(+p.v.toFixed(2))}</text>`;
            });
          });
          y += ph + GAP;
        });

        if (hasMoreExercises && !isExport) {
          const btnW = 260, btnH = 38;
          const btnX = (W - btnW) / 2;
          const btnY = y - GAP + 14;
          const btnText = expanded
            ? '▲ MOSTRAR TOP 10'
            : `▼ VER TODOS (${maxExercisesAthletes} ATLETAS)`;

          body += `<g class="svg-expand-btn" data-action="toggle-expand" data-section="exercises">
            <rect x="${btnX}" y="${btnY}" width="${btnW}" height="${btnH}" rx="19" fill="#141720" stroke="#ff8a2a" stroke-width="1.6" stroke-opacity=".9"/>
            <text x="${W / 2}" y="${btnY + 24}" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ff9a47" letter-spacing="0.4">${esc(btnText)}</text>
          </g>`;

          y += btnH + 18;
        }
      }

      // --- 2. BLOQUE LEADERBOARD GENERAL (ABAJO) ---
      const rawCrit = window.SCORING_CRITERIA || { pos: { btnLabel: 'PUNTOS FIJOS' }, rel: { btnLabel: 'RELATIVO AL LÍDER' } };
      const allCrit = {};
      Object.keys(rawCrit).forEach(k => {
        const c = rawCrit[k];
        if (c && c.enabled !== false && c.activo !== false && c.habilitado !== false && !c.disabled) {
          allCrit[k] = c;
        }
      });

      const critKeys = Object.keys(allCrit);
      if (!allCrit[currentGmode] && critKeys.length > 0) {
        currentGmode = critKeys[0];
      }

      const gmode = currentGmode;
      const criteria = allCrit[gmode] || {
        btnLabel: gmode.toUpperCase(),
        cardTitle: 'POSICIONES GENERALES',
        ptsColumnHeader: 'PTS',
        getSubtitle: () => '',
        formatScore: pts => String(Math.round(pts)),
        calcExercisePoints: (entry, col, totalAthletes, totalExercises) => {
          const maxV = col.list[0] ? col.list[0].v : 0;
          return entry && maxV > 0 ? (totalAthletes - entry.r + 1) : 0;
        }
      };

      if (page !== 'exercises' && cols.length > 0) {
        const athletesMap = new Map();
        filteredAthletes.forEach(a => {
          if (a.name && !athletesMap.has(a.name)) {
            athletesMap.set(a.name, {
              es_profe: !!a.es_profe,
              grupo: a.grupo || '',
              fecha: a.fecha || ''
            });
          }
        });
        const totalAthletes = athletesMap.size;

        const glist = Array.from(athletesMap.entries()).map(([name, meta]) => {
          const reps = cols.map(c => {
            const entry = c.list.find(x => x.n === name);
            return entry ? { v: entry.v, r: entry.r } : null;
          });

          let pts = 0;
          if (typeof criteria.calcAthleteScore === 'function') {
            pts = criteria.calcAthleteScore(reps, cols, totalAthletes);
          } else {
            cols.forEach((c, idx) => {
              const entry = reps[idx];
              if (entry) {
                const gained = criteria.calcExercisePoints(entry, c, totalAthletes, cols.length);
                pts += gained;
              }
            });
          }
          return { n: name, es_profe: meta.es_profe, grupo: meta.grupo, fecha: meta.fecha, pts, reps };
        }).filter(x => x.reps.some(r => r !== null && !isNaN(r.v)));

        glist.sort((a, b) => b.pts - a.pts);
        glist.forEach((x, k) => {
          x.r = (k && Math.abs(glist[k - 1].pts - x.pts) < 0.001) ? glist[k - 1].r : k + 1;
        });

        const GW = n * CW + (n - 1) * GAP;
        const gx0 = (W - GW) / 2;
        const GCOL = '#f5c542';
        const GR = 54;
        const sub = criteria.getSubtitle(totalAthletes, cols.length);

        if (page !== 'general') {
          // Más aire antes de POSICIONES GENERALES
          y += 55;
          body += `<text x="${W / 2}" y="${y + 36}" text-anchor="middle" font-size="36" font-weight="900" font-style="italic" fill="#fff">POSICIONES GENERALES</text>`;
          body += `<rect x="${W / 2 - 44}" y="${y + 50}" width="88" height="4" rx="2" fill="${GCOL}"/>`;
        }

        // Subtítulo más angosto y contenido en el centro con interlineado de párrafo
        const maxSubW = Math.min(GW * 0.68, 700);
        const subLines = wrapText(sub, maxSubW, "14px 'Segoe UI', Arial, sans-serif");
        let curSubY = (page === 'general') ? (periodLabel ? 176 : 148) : (y + 78);
        subLines.forEach((item, sIdx) => {
          if (item.isNewParagraph) {
            curSubY += 12; // interlineado adicional de cambio de párrafo
          }
          body += `<text x="${W / 2}" y="${curSubY}" text-anchor="middle" font-size="14" fill="#9aa1b0">${esc(item.text)}</text>`;
          curSubY += 20; // interlineado dentro del mismo párrafo
        });

        if (page === 'general') {
          // Espacio entre el subtítulo y la tarjeta dorada en página general
          y = curSubY + 24;
        } else {
          // Espacio generoso entre el subtítulo y la tarjeta dorada
          const extraH = Math.max(0, curSubY - (y + 78) - 20);
          y += 114 + extraH;
        }

        const hasMoreG = glist.length > ROW_LIMIT;
        const displayGlist = expanded ? glist : glist.slice(0, ROW_LIMIT);
        const showBtnG = hasMoreG && !isExport;
        const btnH = 38;

        // Tarjeta con más aire vertical interno
        const gph = 150 + displayGlist.length * GR + (showBtnG ? btnH + 24 : 14);
        body += `<rect x="${gx0}" y="${y}" width="${GW}" height="${gph}" rx="18" fill="#000" fill-opacity=".5" stroke="${GCOL}" stroke-width="3.5"/>`;
        // Trofeo vectorial estilizado idéntico al emoji 🏆 (tamaño armonizado)
        body += `<g transform="translate(${gx0 + 32}, ${y + 26}) scale(0.72)">
          <path fill="#FFAC33" d="M5.123 5h6C12.227 5 13 4.896 13 6V4c0-1.104-.773-2-1.877-2h-8c-2 0-3.583 2.125-3 5 0 0 1.791 9.375 1.917 9.958C2.373 18.5 4.164 20 6.081 20h6.958c1.105 0-.039-1.896-.039-3v-2c0 1.104-.773 2-1.877 2h-4c-1.104 0-1.833-1.042-2-2S3.539 7.667 3.539 7.667C3.206 5.75 4.018 5 5.123 5zm25.812 0h-6C23.831 5 22 4.896 22 6V4c0-1.104 1.831-2 2.935-2h8c2 0 3.584 2.125 3 5 0 0-1.633 9.419-1.771 10-.354 1.5-2.042 3-4 3h-7.146C21.914 20 22 18.104 22 17v-2c0 1.104 1.831 2 2.935 2h4c1.104 0 1.834-1.042 2-2s1.584-7.333 1.584-7.333C32.851 5.75 32.04 5 30.935 5zM20.832 22c0-6.958-2.709 0-2.709 0s-3-6.958-3 0-3.291 10-3.291 10h12.292c-.001 0-3.292-3.042-3.292-10z"/>
          <path fill="#FFCC4D" d="M29.123 6.577c0 6.775-6.77 18.192-11 18.192-4.231 0-11-11.417-11-18.192 0-5.195 1-6.319 3-6.319 1.374 0 6.025-.027 8-.027l7-.001c2.917-.001 4 .684 4 6.347z"/>
          <path fill="#8B4513" d="M27 33c0 1.104.227 2-.877 2h-16C9.018 35 9 34.104 9 33v-1c0-1.104 1.164-2 2.206-2h13.917c1.042 0 1.877.896 1.877 2v1z"/>
          <path fill="#5C2C16" d="M29 34.625c0 .76.165 1.375-1.252 1.375H8.498C7.206 36 7 35.385 7 34.625v-.25C7 33.615 7.738 33 8.498 33h19.25c.759 0 1.252.615 1.252 1.375v.25z"/>
        </g>`;
        body += `<text x="${gx0 + 74}" y="${y + 47}" text-anchor="start" font-size="21" font-weight="900" font-style="italic" fill="${GCOL}">${esc(criteria.cardTitle)}</text>`;

        // Selector dinámico según los criterios disponibles (solo en vista interactiva, no en exportación)
        if (!isExport) {
          const btnGroupW = Math.min(GW - 360, Math.max(280, critKeys.length * 120));
          const btnGroupH = 34;
          const btnGroupX = gx0 + GW - 24 - btnGroupW;
          const btnGroupY = y + 25;
          const btnW = btnGroupW / Math.max(critKeys.length, 1);

          body += `<g class="svg-seg" transform="translate(${btnGroupX}, ${btnGroupY})">
            <rect width="${btnGroupW}" height="${btnGroupH}" rx="8" fill="#0d0f14" stroke="#3a4050" stroke-width="1.5"/>`;

          critKeys.forEach((key, idx) => {
            const isSel = gmode === key;
            const crit = allCrit[key];
            const bx = idx * btnW;
            const fs = btnW < 95 ? 9 : (btnW < 110 ? 10 : (btnW < 125 ? 10.5 : 11));
            const ls = btnW < 110 ? 0.2 : 0.5;
            body += `<g class="svg-mode-btn" data-mode="${esc(key)}">
              <rect x="${bx + 2}" y="2" width="${btnW - 4}" height="${btnGroupH - 4}" rx="6" fill="${isSel ? '#f5c542' : 'transparent'}"/>
              <text x="${bx + btnW / 2}" y="21" text-anchor="middle" font-size="${fs}" font-weight="${isSel ? '800' : '600'}" fill="${isSel ? '#1a1005' : '#9aa1b0'}" letter-spacing="${ls}">${esc(crit.btnLabel || key.toUpperCase())}</text>
            </g>`;
          });

          body += `</g>`;
        }

        const showGroupCol = includeGroupBadges;
        const groupColW = showGroupCol ? 90 : 0;
        const rowX = gx0 + 24;
        const rowW = GW - 48;
        const ptsW = 105;
        const nameW = showGroupCol
          ? Math.min(220, Math.max(150, Math.floor(rowW * 0.22)))
          : Math.min(260, Math.max(160, Math.floor(rowW * 0.28)));
        const exAreaW = rowW - nameW - groupColW - ptsW;
        const exW = cols.length > 0 ? exAreaW / cols.length : 0;

        // Línea divisoria elegante que separa la cabecera (título y selector) de las columnas
        body += `<line x1="${rowX}" y1="${y + 78}" x2="${rowX + rowW}" y2="${y + 78}" stroke="#2a303f" stroke-width="1.2"/>`;

        // Encabezados de columnas con amplio espacio vertical (muy separado del selector superior)
        const colHeaderY = y + 108;
        if (showGroupCol) {
          const grpX = rowX + nameW + groupColW / 2;
          body += `<text x="${grpX}" y="${colHeaderY}" text-anchor="middle" font-size="12" font-weight="700" fill="#9aa1b0" letter-spacing="0.5">GRUPO</text>`;
        }

        cols.forEach((c, ci) => {
          const cx = rowX + nameW + groupColW + ci * exW + exW / 2;
          const fs = exW < 100 ? 10 : 12;
          const mc = Math.max(5, Math.floor(exW / (fs * 0.68)));
          const lines = splitMid(splitLeadingEmoji(c.h).text.toUpperCase()).map(t => t.length > mc ? t.slice(0, mc - 1) + '.' : t);
          lines.forEach((t, j) => {
            body += `<text x="${cx}" y="${(lines.length > 1 ? colHeaderY - 7 : colHeaderY) + j * 15}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="${COLORS[ci % 4]}" letter-spacing="0.5">${esc(t)}</text>`;
          });
        });

        body += `<text x="${rowX + rowW - ptsW / 2}" y="${colHeaderY}" text-anchor="middle" font-size="12" font-weight="900" fill="${GCOL}" letter-spacing="0.5">${esc(criteria.ptsColumnHeader || 'PTS')}</text>`;

        // Filas de atletas con inicio amplio
        displayGlist.forEach((p, j) => {
          const yy = y + 138 + j * GR;
          const hi = p.r <= 3;
          const rowBg = j % 2 === 0 ? '#141720' : '#11141b';

          body += `<rect x="${rowX}" y="${yy}" width="${rowW}" height="46" rx="7" fill="${rowBg}" stroke="${hi ? MEDAL[p.r] : '#222733'}" stroke-width="${hi ? 1.5 : 1}"/>`;

          if (hi) {
            body += `<circle cx="${rowX + 23}" cy="${yy + 23}" r="15" fill="${MEDAL[p.r]}" stroke="#fff" stroke-opacity=".4"/>`;
            body += `<text x="${rowX + 23}" y="${yy + 29}" text-anchor="middle" font-size="16" font-weight="800" fill="#1b1b1b">${p.r}</text>`;
          } else {
            body += `<text x="${rowX + 23}" y="${yy + 29}" text-anchor="middle" font-size="16" font-weight="700" fill="#8b93a6">${p.r}º</text>`;
          }

          body += `<text x="${rowX + 54}" y="${yy + 29}" text-anchor="start" font-size="17" font-weight="700" fill="#fff">${esc(p.n)}</text>`;
          const nw = getTextWidth(p.n, "700 17px 'Segoe UI', Arial, sans-serif");
          const maxBadgeX = rowX + nameW - 52;
          let curBadgeX = Math.min(rowX + 54 + Math.round(nw) + 10, maxBadgeX);

          if (p.es_profe) {
            const badgeW = 46, badgeH = 17, badgeY = yy + 14.5;
            body += `<rect x="${curBadgeX}" y="${badgeY}" width="${badgeW}" height="${badgeH}" rx="4" fill="#ff8a2a" fill-opacity=".16" stroke="#ff8a2a" stroke-width="1.2" stroke-opacity=".85"/>`;
            body += `<text x="${curBadgeX + badgeW / 2}" y="${badgeY + 12}" text-anchor="middle" font-size="8.5" font-weight="900" fill="#ff9a47" letter-spacing="0.8">PROFE</text>`;
            curBadgeX += badgeW + 6;
          }

          if (showGroupCol) {
            const grpX = rowX + nameW + groupColW / 2;
            const groupTxt = p.grupo ? formatGroup(p.grupo) : '-';
            body += `<text x="${grpX}" y="${yy + 29}" text-anchor="middle" font-size="14" font-weight="600" fill="#9aa1b0">${esc(groupTxt)}</text>`;
          }

          p.reps.forEach((rep, ci) => {
            const cellX = rowX + nameW + groupColW + ci * exW;
            const cx = cellX + exW / 2;
            if (rep) {
              const rStr = `${+rep.v.toFixed(1)}`;
              body += `<text x="${cx}" y="${yy + 29}" text-anchor="middle" font-size="15" font-weight="600" fill="#9aa1b0">${esc(rStr)}</text>`;
            } else {
              body += `<text x="${cx}" y="${yy + 29}" text-anchor="middle" font-size="15" font-weight="600" fill="#444">-</text>`;
            }
          });

          const ptsX = rowX + rowW - ptsW;
          const valStr = criteria.formatScore ? criteria.formatScore(p.pts) : String(Math.round(p.pts));
          body += `<text x="${ptsX + ptsW / 2}" y="${yy + 30}" text-anchor="middle" font-size="20" font-weight="900" fill="${GCOL}">${esc(valStr)}</text>`;
        });

        if (showBtnG) {
          const btnW = 280;
          const btnX = (W - btnW) / 2;
          const btnY = y + 138 + displayGlist.length * GR + 10;
          const btnText = expanded
            ? '▲ MOSTRAR TOP 10'
            : `▼ VER TABLA COMPLETA (${glist.length} ATLETAS)`;

          body += `<g class="svg-expand-btn" data-action="toggle-expand" data-section="general">
            <rect x="${btnX}" y="${btnY}" width="${btnW}" height="${btnH}" rx="19" fill="#141720" stroke="${GCOL}" stroke-width="1.6" stroke-opacity=".9"/>
            <text x="${W / 2}" y="${btnY + 24}" text-anchor="middle" font-size="12.5" font-weight="800" fill="${GCOL}" letter-spacing="0.4">${esc(btnText)}</text>
          </g>`;
        }

        y += gph + (page === 'general' ? 40 : GAP + 6);
      }

      const H = (page === 'general') ? y : (y - GAP + 34);
      const mainTitle = (page === 'general') ? 'POSICIONES GENERALES' : 'RANKING POR EJERCICIO';

      const head = `<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f2b"/>
      <stop offset=".5" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
  </defs>
  <rect width="${W}" height="${H}" fill="url(#bg)"/>
  <text x="${W / 2}" y="64" text-anchor="middle" font-size="38" font-weight="900" font-style="italic" fill="#ff8a2a">MÁXIMOS - CALISTENIA</text>
  <text x="${W / 2}" y="110" text-anchor="middle" font-size="44" font-weight="900" font-style="italic" fill="#fff">${mainTitle}</text>
  ${periodLabel ? `<text x="${W / 2}" y="145" text-anchor="middle" font-size="15" font-weight="800" fill="#9aa1b0" letter-spacing="1.5">${esc(periodLabel.toUpperCase())}</text>` : ''}`;

      return {
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">${head}${body}</svg>`,
        W,
        H
      };
    }

    function render() {
      try {
        if (!currentRecord) {
          $('prev').innerHTML = '<div class="status-msg error">No hay registros disponibles para el período seleccionado.</div>';
          curSvg = null;
          return;
        }
        curSvg = buildSvg(currentRecord, exercisesConfig, currentPeriod, currentGroup);
        if (curSvg) {
          $('prev').innerHTML = curSvg.svg;
        } else {
          $('prev').innerHTML = '<div class="status-msg">No se encontraron atletas o ejercicios para los filtros seleccionados.</div>';
        }
      } catch (e) {
        $('prev').innerHTML = `<div class="status-msg error">Error al procesar los datos: ${esc(e.message)}</div>`;
      }
    }

    async function loadPeriodData(period) {
      currentPeriod = period;
      $('prev').innerHTML = `
    <div class="status-msg loading">
      <div class="spinner"></div>
      <span>Cargando datos del período ${esc(period)}...</span>
    </div>
  `;

      try {
        const res = await fetch(`data/registros/${period}.json`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        currentRecord = await res.json();
        updateGroupFilter(currentRecord.athletes);
        render();
      } catch (err) {
        console.warn(`Error al obtener data/registros/${period}.json via fetch:`, err);
        if (period === "2026-10" || period === "2026-10-19") {
          currentRecord = FALLBACK_RECORD;
          updateGroupFilter(currentRecord.athletes);
          render();
        } else {
          $('prev').innerHTML = `<div class="status-msg error">No se pudo cargar el archivo data/registros/${esc(period)}.json (${esc(err.message)})</div>`;
        }
      }
    }

    async function init() {
      // Load exercises definition
      try {
        const exRes = await fetch('data/ejercicios.json');
        if (exRes.ok) {
          exercisesConfig = await exRes.json();
        } else {
          exercisesConfig = FALLBACK_EXERCISES;
        }
      } catch (e) {
        exercisesConfig = FALLBACK_EXERCISES;
      }

      // Load period list
      try {
        const perRes = await fetch('data/periodos.json');
        if (perRes.ok) {
          availablePeriods = await perRes.json();
        } else {
          availablePeriods = FALLBACK_PERIODS;
        }
      } catch (e) {
        availablePeriods = FALLBACK_PERIODS;
      }

      if (!availablePeriods || !availablePeriods.length) {
        availablePeriods = FALLBACK_PERIODS;
      }

      if (availablePeriods && availablePeriods.length) {
        availablePeriods.sort((a, b) => {
          const idA = typeof a === 'object' && a.id ? a.id : String(a);
          const idB = typeof b === 'object' && b.id ? b.id : String(b);
          return idB.localeCompare(idA);
        });
      }

      // Populate period options
      const periodSelect = $('periodSelect');
      const periodMenu = $('periodMenu');
      if (periodSelect) periodSelect.innerHTML = '';
      if (periodMenu) periodMenu.innerHTML = '';

      availablePeriods.forEach(p => {
        const id = typeof p === 'object' && p.id ? p.id : String(p);
        const name = typeof p === 'object' && (p.nombre || p.name) ? (p.nombre || p.name) : id;

        if (periodSelect) {
          const opt = document.createElement('option');
          opt.value = id;
          opt.textContent = name;
          periodSelect.appendChild(opt);
        }

        if (periodMenu) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'custom-select-option';
          btn.dataset.value = id;
          btn.textContent = name;
          btn.addEventListener('click', () => {
            selectPeriod(id, name);
          });
          periodMenu.appendChild(btn);
        }
      });

      const defaultObj = availablePeriods[0];
      const defaultPeriod = typeof defaultObj === 'object' && defaultObj.id ? defaultObj.id : String(defaultObj);
      const defaultName = typeof defaultObj === 'object' && (defaultObj.nombre || defaultObj.name) ? (defaultObj.nombre || defaultObj.name) : defaultPeriod;

      function selectPeriod(periodId, periodName) {
        isExpanded = false;
        if ($('periodSelect')) $('periodSelect').value = periodId;
        if ($('periodVal')) {
          const pObj = availablePeriods.find(p => (typeof p === 'object' && p.id ? p.id : String(p)) === periodId);
          const name = periodName || (pObj && (pObj.nombre || pObj.name) ? (pObj.nombre || pObj.name) : periodId);
          $('periodVal').textContent = name;
        }
        if ($('periodMenu')) {
          Array.from($('periodMenu').children).forEach(btn => {
            btn.classList.toggle('active', btn.dataset.value === periodId);
          });
          $('periodMenu').classList.remove('show');
          if ($('periodBtn')) $('periodBtn').setAttribute('aria-expanded', 'false');
        }
        loadPeriodData(periodId);
      }

      selectPeriod(defaultPeriod, defaultName);

      // Listeners
      $('profeCheck').addEventListener('change', render);
      $('groupBadgeCheck').addEventListener('change', render);

      // Listeners para interactividad dentro del SVG
      $('prev').addEventListener('click', e => {
        const modeBtn = e.target.closest('[data-mode]');
        if (modeBtn) {
          const newMode = modeBtn.dataset.mode;
          if (newMode && newMode !== currentGmode) {
            currentGmode = newMode;
            render();
          }
          return;
        }

        const expandBtn = e.target.closest('[data-action="toggle-expand"]');
        if (expandBtn) {
          const section = expandBtn.dataset.section;
          const rectBefore = expandBtn.getBoundingClientRect();
          const wasExpanded = isExpanded;
          isExpanded = !isExpanded;
          render();

          const targetBtn = section ? $('prev').querySelector(`[data-action="toggle-expand"][data-section="${section}"]`) : null;
          if (targetBtn) {
            if (wasExpanded) {
              targetBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
              const rectAfter = targetBtn.getBoundingClientRect();
              window.scrollBy(0, rectAfter.top - rectBefore.top);
            }
          }
        }
      });

      // Dropdown toggle system
      function setupDropdown(btnId, menuId) {
        const btn = $(btnId);
        const menu = $(menuId);
        if (!btn || !menu) return;

        btn.addEventListener('click', e => {
          e.stopPropagation();
          const isOpen = menu.classList.contains('show');
          document.querySelectorAll('.custom-select-menu.show, .export-menu.show').forEach(m => {
            m.classList.remove('show');
            const parentBtn = m.previousElementSibling;
            if (parentBtn && parentBtn.setAttribute) parentBtn.setAttribute('aria-expanded', 'false');
          });
          if (!isOpen) {
            menu.classList.add('show');
            btn.setAttribute('aria-expanded', 'true');
          }
        });
      }

      setupDropdown('periodBtn', 'periodMenu');
      setupDropdown('groupBtn', 'groupMenu');
      setupDropdown('exportBtn', 'exportMenu');

      document.addEventListener('click', () => {
        document.querySelectorAll('.custom-select-menu.show, .export-menu.show').forEach(m => {
          m.classList.remove('show');
          const parentBtn = m.previousElementSibling;
          if (parentBtn && parentBtn.setAttribute) parentBtn.setAttribute('aria-expanded', 'false');
        });
      });

      // Download buttons
      function dl(blob, name) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }

      function getExportFilename(ext, suffix = '') {
        const pStr = currentPeriod || 'export';
        const gStr = currentGroup !== 'all' ? `-${currentGroup}` : '';
        const sufStr = suffix ? `-${suffix}` : '';
        return `leaderboard-${pStr}${gStr}${sufStr}.${ext}`;
      }

      function getCleanExportSvgs() {
        if (isExpanded) {
          const p1 = buildSvg(currentRecord, exercisesConfig, currentPeriod, currentGroup, true, true, 'exercises');
          const p2 = buildSvg(currentRecord, exercisesConfig, currentPeriod, currentGroup, true, true, 'general');
          return [p1, p2].filter(Boolean);
        }
        const p = buildSvg(currentRecord, exercisesConfig, currentPeriod, currentGroup, true, false, 'all');
        return p ? [p] : [];
      }

      $('svgBtn').onclick = () => {
        exportMenu.classList.remove('show');
        exportBtn.setAttribute('aria-expanded', 'false');
        const svgs = getCleanExportSvgs();
        if (!svgs.length) return;

        if (svgs.length === 1) {
          dl(new Blob([svgs[0].svg], { type: 'image/svg+xml' }), getExportFilename('svg'));
        } else {
          dl(new Blob([svgs[0].svg], { type: 'image/svg+xml' }), getExportFilename('svg', 'ejercicios'));
          setTimeout(() => {
            dl(new Blob([svgs[1].svg], { type: 'image/svg+xml' }), getExportFilename('svg', 'general'));
          }, 300);
        }
      };

      async function setPngDpi300(blob) {
        try {
          const buffer = await blob.arrayBuffer();
          const bytes = new Uint8Array(buffer);
          if (bytes[0] !== 0x89 || bytes[1] !== 0x50 || bytes[2] !== 0x4E || bytes[3] !== 0x47) {
            return blob;
          }

          // Chunk pHYs para 300 ppp (11811 píxeles/metro):
          // 4 bytes longitud (9) + 4 bytes tipo ('pHYs') + 4 bytes X + 4 bytes Y + 1 byte unidad (metro) + 4 bytes CRC
          const physChunk = new Uint8Array([
            0x00, 0x00, 0x00, 0x09,
            0x70, 0x48, 0x59, 0x73,
            0x00, 0x00, 0x2e, 0x23,
            0x00, 0x00, 0x2e, 0x23,
            0x01,
            0x78, 0xa5, 0x3f, 0x76
          ]);

          const view = new DataView(buffer);
          const ihdrLen = view.getUint32(8);
          const insertPos = 8 + 4 + 4 + ihdrLen + 4;

          let pos = insertPos;
          let existingPhysPos = -1;
          let existingPhysLen = 0;
          while (pos < bytes.length - 8) {
            const chunkLen = view.getUint32(pos);
            const chunkType = String.fromCharCode(bytes[pos + 4], bytes[pos + 5], bytes[pos + 6], bytes[pos + 7]);
            if (chunkType === 'pHYs') {
              existingPhysPos = pos;
              existingPhysLen = 12 + chunkLen;
              break;
            }
            if (chunkType === 'IDAT') break;
            pos += 12 + chunkLen;
          }

          let finalBytes;
          if (existingPhysPos !== -1) {
            finalBytes = new Uint8Array(bytes.length - existingPhysLen + physChunk.length);
            finalBytes.set(bytes.subarray(0, existingPhysPos), 0);
            finalBytes.set(physChunk, existingPhysPos);
            finalBytes.set(bytes.subarray(existingPhysPos + existingPhysLen), existingPhysPos + physChunk.length);
          } else {
            finalBytes = new Uint8Array(bytes.length + physChunk.length);
            finalBytes.set(bytes.subarray(0, insertPos), 0);
            finalBytes.set(physChunk, insertPos);
            finalBytes.set(bytes.subarray(insertPos), insertPos + physChunk.length);
          }

          return new Blob([finalBytes], { type: 'image/png' });
        } catch (e) {
          console.warn('No se pudo incrustar metadatos 300 ppp en PNG:', e);
          return blob;
        }
      }

      $('pngBtn').onclick = () => {
        exportMenu.classList.remove('show');
        exportBtn.setAttribute('aria-expanded', 'false');
        const svgs = getCleanExportSvgs();
        if (!svgs.length) return;

        function exportPng(item, suffix, cb) {
          const s = item.svg.replace('<svg ', `<svg width="${item.W}" height="${item.H}" `);
          const img = new Image();
          img.onload = () => {
            const scale = 300 / 96; // 3.125 para 300 ppp exactos a partir de dimensiones base estándar (96 DPI)
            const c = document.createElement('canvas');
            c.width = Math.round(item.W * scale);
            c.height = Math.round(item.H * scale);
            const x = c.getContext('2d');
            x.scale(scale, scale);
            x.drawImage(img, 0, 0, item.W, item.H);
            c.toBlob(async b => {
              const printBlob = await setPngDpi300(b);
              dl(printBlob, getExportFilename('png', suffix));
              if (cb) cb();
            }, 'image/png');
          };
          img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
        }

        if (svgs.length === 1) {
          exportPng(svgs[0], '');
        } else {
          exportPng(svgs[0], 'ejercicios', () => {
            setTimeout(() => {
              exportPng(svgs[1], 'general');
            }, 300);
          });
        }
      };

      let _segoeCache = null;
      async function getSegoeFonts() {
        if (_segoeCache) return _segoeCache;
        const fontFiles = [
          { name: 'SegoeUI-Regular.ttf', url: 'fonts/segoeui.ttf' },
          { name: 'SegoeUI-Bold.ttf', url: 'fonts/segoeuib.ttf' },
          { name: 'SegoeUI-Black.ttf', url: 'fonts/seguibl.ttf' },
          { name: 'SegoeUI-BlackItalic.ttf', url: 'fonts/seguibli.ttf' }
        ];

        function arrayBufferToBinaryString(buf) {
          const bytes = new Uint8Array(buf);
          const CHUNK_SIZE = 8192;
          let binary = '';
          for (let i = 0; i < bytes.length; i += CHUNK_SIZE) {
            binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK_SIZE));
          }
          return binary;
        }

        const loaded = await Promise.all(fontFiles.map(async f => {
          try {
            const res = await fetch(f.url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const buf = await res.arrayBuffer();
            return { name: f.name, data: arrayBufferToBinaryString(buf) };
          } catch (e) {
            console.warn(`No se pudo cargar fuente local ${f.url}:`, e);
            return null;
          }
        }));

        _segoeCache = loaded.filter(Boolean);
        return _segoeCache;
      }

      function registerSegoeInPdf(doc, fonts) {
        if (!fonts || !fonts.length) return;
        fonts.forEach(f => {
          doc.addFileToVFS(f.name, f.data);
        });

        const families = ['Segoe UI', 'segoe ui', 'SegoeUI'];
        families.forEach(fam => {
          // 400 / normal / 600
          doc.addFont('SegoeUI-Regular.ttf', fam, 'normal');
          doc.addFont('SegoeUI-Regular.ttf', fam, '400');
          doc.addFont('SegoeUI-Regular.ttf', fam, '400normal');
          doc.addFont('SegoeUI-Regular.ttf', fam, '600');
          doc.addFont('SegoeUI-Regular.ttf', fam, '600normal');

          // 700 / 800 / bold
          doc.addFont('SegoeUI-Bold.ttf', fam, 'bold');
          doc.addFont('SegoeUI-Bold.ttf', fam, '700');
          doc.addFont('SegoeUI-Bold.ttf', fam, '700normal');
          doc.addFont('SegoeUI-Bold.ttf', fam, '800');
          doc.addFont('SegoeUI-Bold.ttf', fam, '800normal');

          // 900 / black
          doc.addFont('SegoeUI-Black.ttf', fam, '900');
          doc.addFont('SegoeUI-Black.ttf', fam, '900normal');

          // 900 Italic / bolditalic / italic
          doc.addFont('SegoeUI-BlackItalic.ttf', fam, 'bolditalic');
          doc.addFont('SegoeUI-BlackItalic.ttf', fam, 'italic');
          doc.addFont('SegoeUI-BlackItalic.ttf', fam, '900italic');
          doc.addFont('SegoeUI-BlackItalic.ttf', fam, '800italic');
          doc.addFont('SegoeUI-BlackItalic.ttf', fam, '700italic');
        });
      }

      $('pdfBtn').onclick = async () => {
        exportMenu.classList.remove('show');
        exportBtn.setAttribute('aria-expanded', 'false');
        const svgs = getCleanExportSvgs();
        if (!svgs.length) return;

        // 1. Exportación 100% Vectorial con svg2pdf y tipografía Segoe UI incrustada
        try {
          const { jsPDF } = window.jspdf;
          const p1 = svgs[0];
          const orientation1 = p1.W > p1.H ? 'l' : 'p';
          const pdf = new jsPDF({
            orientation: orientation1,
            unit: 'pt',
            format: [p1.W, p1.H]
          });

          // Incrustar fuentes Segoe UI reales para coincidir 100% con la visualización
          const segoeFonts = await getSegoeFonts();
          registerSegoeInPdf(pdf, segoeFonts);

          if (typeof pdf.svg === 'function') {
            const parser = new DOMParser();
            for (let i = 0; i < svgs.length; i++) {
              const p = svgs[i];
              if (i > 0) {
                const orientation = p.W > p.H ? 'l' : 'p';
                pdf.addPage([p.W, p.H], orientation);
              }
              const svgDoc = parser.parseFromString(p.svg, 'image/svg+xml');
              const svgElem = svgDoc.documentElement;
              await pdf.svg(svgElem, {
                x: 0,
                y: 0,
                width: p.W,
                height: p.H
              });
            }
            pdf.save(getExportFilename('pdf'));
            return;
          }
        } catch (err) {
          console.warn('Fallo renderizado vectorial svg2pdf, ejecutando fallback:', err);
        }

        // 2. Fallback de ultra alta definición (300 ppp) en caso de que svg2pdf no esté disponible
        try {
          const scale = 300 / 72; // ~4.167 para 300 ppp exactos sobre puntos tipográficos (72 pt)
          const renderItemToCanvas = (item) => new Promise((resolve, reject) => {
            const s = item.svg.replace('<svg ', `<svg width="${item.W}" height="${item.H}" `);
            const img = new Image();
            img.onload = () => {
              const c = document.createElement('canvas');
              c.width = Math.round(item.W * scale);
              c.height = Math.round(item.H * scale);
              const x = c.getContext('2d');
              x.scale(scale, scale);
              x.drawImage(img, 0, 0, item.W, item.H);
              resolve({
                dataUrl: c.toDataURL('image/png'),
                W: item.W,
                H: item.H
              });
            };
            img.onerror = reject;
            img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
          });

          const renderedPages = [];
          for (const item of svgs) {
            renderedPages.push(await renderItemToCanvas(item));
          }

          const { jsPDF } = window.jspdf;
          const p1 = renderedPages[0];
          const orientation1 = p1.W > p1.H ? 'l' : 'p';
          const pdf = new jsPDF({
            orientation: orientation1,
            unit: 'pt',
            format: [p1.W, p1.H]
          });

          for (let i = 0; i < renderedPages.length; i++) {
            const p = renderedPages[i];
            if (i > 0) {
              const orientation = p.W > p.H ? 'l' : 'p';
              pdf.addPage([p.W, p.H], orientation);
            }
            pdf.addImage(p.dataUrl, 'PNG', 0, 0, p.W, p.H, undefined, 'FAST');
          }
          pdf.save(getExportFilename('pdf'));
        } catch (e) {
          console.error('Error al exportar PDF:', e);
        }
      };

      // Precarga en segundo plano de las fuentes Segoe UI para exportación instantánea
      getSegoeFonts().catch(err => console.warn('Aviso precarga fuentes:', err));

      // Load the initial period
      await loadPeriodData(defaultPeriod);
    }

    init();
  </script>
