<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Leaderboard - Calistenia</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="criterios.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0f14;
      --card: #171a22;
      --line: #2a2f3b;
      --tx: #eef0f4;
      --mute: #9aa1b0;
      --acc: #ff8a2a;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      padding: 24px 20px
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      gap: 22px
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    h1 {
      font-size: 22px;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    h1 span {
      color: var(--acc)
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px 24px
    }

    .header-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--mute);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      white-space: nowrap;
    }

    select {
      background: #171a22;
      color: var(--tx);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 12px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      outline: none;
      transition: border-color .15s ease;
    }

    select:focus {
      border-color: var(--acc);
    }

    .toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: var(--tx);
      cursor: pointer;
      user-select: none;
      background: #171a22;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 12px;
      transition: border-color .15s ease, background .15s ease;
    }

    .toggle-label:hover {
      border-color: #3d4557;
    }

    .toggle-label input {
      accent-color: var(--acc);
      width: 15px;
      height: 15px;
      margin: 0;
      cursor: pointer;
    }

    /* Export dropdown */
    .export-dropdown {
      position: relative;
    }

    .btn-export {
      background: var(--acc);
      color: #1a1005;
      border: 1px solid var(--acc);
      border-radius: 8px;
      padding: 7px 13px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background .15s ease, border-color .15s ease;
    }

    .btn-export:hover {
      background: #ff9a47;
      border-color: #ff9a47;
    }

    .btn-export svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .export-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: #171a22;
      border: 1px solid var(--line);
      border-radius: 10px;
      min-width: 150px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 4px;
      z-index: 100;
    }

    .export-menu.show {
      display: flex;
    }

    .export-menu button {
      background: transparent;
      border: none;
      color: var(--tx);
      border-radius: 6px;
      padding: 8px 12px;
      text-align: left;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background .15s ease, color .15s ease;
    }

    .export-menu button:hover {
      background: #252b38;
      color: var(--acc);
    }

    .export-menu button span.ext {
      font-size: 11px;
      color: var(--mute);
      text-transform: uppercase;
      font-weight: 600;
    }

    .prev {
      overflow-x: auto;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 16px
    }

    .prev svg {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px
    }

    .svg-mode-btn {
      cursor: pointer;
      user-select: none;
      transition: opacity .15s ease
    }

    .svg-mode-btn:hover {
      opacity: .82
    }

    .status-msg {
      text-align: center;
      padding: 50px 20px;
      color: var(--mute);
      font-size: 15px
    }

    .status-msg.error {
      color: #ff6b6b
    }

    .status-msg.loading {
      color: var(--acc);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--line);
      border-top-color: var(--acc);
      border-radius: 50%;
      animation: spin .8s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @media(max-width:750px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .header-controls {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="header">
      <h1>🏆 <span>CPW</span> LEADERBOARD</h1>

      <div class="header-controls">
        <div class="header-item">
          <label class="header-label" for="periodSelect">Período:</label>
          <select id="periodSelect">
            <option value="">Cargando períodos...</option>
          </select>
        </div>

        <div class="header-item">
          <label class="header-label" for="groupSelect">Grupo:</label>
          <select id="groupSelect">
            <option value="all">Todos los grupos</option>
          </select>
        </div>

        <label class="toggle-label" title="Mostrar u ocultar profesores">
          <input type="checkbox" id="profeCheck" checked>
          <span>Profesores</span>
        </label>

        <div class="export-dropdown">
          <button class="btn-export" id="exportBtn" type="button" aria-haspopup="true" aria-expanded="false"
            title="Exportar leaderboard">
            <svg viewBox="0 0 24 24">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" />
            </svg>
            <span>Exportar</span>
          </button>
          <div class="export-menu" id="exportMenu">
            <button type="button" id="pdfBtn">
              <span>Documento</span>
              <span class="ext">PDF</span>
            </button>
            <button type="button" id="pngBtn">
              <span>Imagen</span>
              <span class="ext">PNG</span>
            </button>
            <button type="button" id="svgBtn">
              <span>Vector</span>
              <span class="ext">SVG</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="card prev" id="prev">
      <div class="status-msg loading">
        <div class="spinner"></div>
        <span>Cargando leaderboard...</span>
      </div>
    </div>
  </div>

  <script>
    const COLORS = ['#ff8a2a', '#818cf8', '#2dd4bf', '#38bdf8'];
    const MEDAL = { 1: '#f5c542', 2: '#c9ced6', 3: '#cd7f32' };
    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    let availablePeriods = [];
    let exercisesConfig = [];
    let currentRecord = null;
    let currentPeriod = '';
    let currentGroup = 'all';
    let currentGmode = 'pos';
    let curSvg = null;

    // Embedded fallback data in case local file:// blocks fetch
    const FALLBACK_EXERCISES = {
      "exercises": [
        { "id": "dominadas_pronas", "name": "Dominadas pronas" },
        { "id": "fondos", "name": "Fondos en paralelas" },
        { "id": "lagartijas", "name": "Lagartijas" },
        { "id": "dominadas_supinas", "name": "Dominadas supinas" }
      ]
    };

    const FALLBACK_PERIODS = [
      { "id": "2026-10", "nombre": "Octubre 2026" }
    ];

    const FALLBACK_RECORD = {
      "period": "2026-10",
      "name": "Octubre 2026",
      "athletes": [
        { "name": "Fabri", "grupo": "LMV1730", "fecha": "2026-10-19", "es_profe": true, "results": { "dominadas_pronas": 27, "fondos": 43, "lagartijas": 40, "dominadas_supinas": 21 } },
        { "name": "Tadeo", "grupo": "LMV1730", "fecha": "2026-10-19", "es_profe": false, "results": { "dominadas_pronas": 17, "fondos": 17, "lagartijas": 28, "dominadas_supinas": 16 } },
        { "name": "Lucía", "grupo": "LMV1730", "fecha": "2026-10-19", "es_profe": false, "results": { "dominadas_pronas": 14, "fondos": 12, "lagartijas": 40, "dominadas_supinas": 13 } },
        { "name": "Joaquín", "grupo": "LMV1730", "fecha": "2026-10-19", "es_profe": false, "results": { "dominadas_pronas": 13, "fondos": 11, "lagartijas": 14, "dominadas_supinas": 12 } },
        { "name": "Maxi", "grupo": "LMV1730", "fecha": "2026-10-19", "es_profe": false, "results": { "dominadas_pronas": 13, "fondos": 23, "lagartijas": 41, "dominadas_supinas": 10 } },
        { "name": "S", "grupo": "LMV1730", "fecha": "2026-10-19", "es_profe": false, "results": { "dominadas_pronas": 12, "fondos": 17, "lagartijas": 36, "dominadas_supinas": 13 } },
        { "name": "Ro", "grupo": "LMV1730", "fecha": "2026-10-19", "es_profe": false, "results": { "dominadas_pronas": 11, "fondos": 17, "lagartijas": 33, "dominadas_supinas": 11 } },
        { "name": "Bruno", "grupo": "LMV1730", "fecha": "2026-10-19", "es_profe": false, "results": { "dominadas_pronas": 11, "fondos": 18, "lagartijas": 40, "dominadas_supinas": 9 } },
        { "name": "Tony", "grupo": "LMV1730", "fecha": "2026-10-19", "es_profe": false, "results": { "dominadas_pronas": 9, "fondos": 18, "lagartijas": 24, "dominadas_supinas": 10 } }
      ]
    };

    function updateGroupFilter(athletes) {
      const groupSelect = $('groupSelect');
      if (!groupSelect) return;
      const groups = Array.from(
        new Set((athletes || []).map(a => a.grupo).filter(g => g && String(g).trim() !== ''))
      ).sort();

      const prevGroup = currentGroup;
      groupSelect.innerHTML = '<option value="all">Todos los grupos</option>';
      groups.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g;
        opt.textContent = g;
        groupSelect.appendChild(opt);
      });

      if (groups.includes(prevGroup)) {
        groupSelect.value = prevGroup;
        currentGroup = prevGroup;
      } else {
        groupSelect.value = 'all';
        currentGroup = 'all';
      }
    }

    function splitLeadingEmoji(str) {
      const s = String(str || '').trim();
      if (!s) return { em: '', text: '' };
      const m = s.match(/^(\p{Extended_Pictographic}\uFE0F?)\s*/u);
      if (m) return { em: m[1], text: s.slice(m[0].length) };
      return { em: '', text: s };
    }

    function parseNum(val) {
      if (val === undefined || val === null) return NaN;
      const clean = String(val).trim().replace(',', '.');
      if (clean === '') return NaN;
      const m = clean.match(/-?\d+(\.\d+)?/);
      return m ? parseFloat(m[0]) : NaN;
    }

    function icon(h, x, y, col) {
      const k = h.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      const g = `<g transform="translate(${x},${y})" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">`;
      const dumb = g + '<path d="M10 20H30M10 11V29M30 11V29M5 15V25M35 15V25"/></g>';
      if (/pesa|press|curl/.test(k)) return dumb;
      if (/domin|pull|barra/.test(k)) return g + '<path d="M3 6H37M7 6V37M33 6V37"/></g>';
      if (/fondo|dip|paralela/.test(k)) return g + '<path d="M5 13H18M11 13V37M22 13H35M29 13V37"/></g>';
      if (/lagart|flexion|push|plancha/.test(k)) return g + '<circle cx="8" cy="15" r="3.5"/><path d="M13 19L35 27M15 21V33M3 35H38"/></g>';
      return dumb;
    }

    function wrap(h) {
      if (h.length <= 14 || !h.includes(' ')) return [h];
      const mid = h.length / 2;
      let best = -1;
      for (let i = 0; i < h.length; i++) {
        if (h[i] === ' ' && (best < 0 || Math.abs(i - mid) < Math.abs(best - mid))) best = i;
      }
      return [h.slice(0, best), h.slice(best + 1)];
    }

    function splitMid(h) {
      const parts = h.split(/\s+/);
      if (parts.length < 2) return [h];
      const mid = h.length / 2;
      let acc = 0, cut = 1;
      for (let i = 0; i < parts.length - 1; i++) {
        acc += parts[i].length + 1;
        if (acc <= mid + 2) cut = i + 1;
      }
      return [parts.slice(0, cut).join(' '), parts.slice(cut).join(' ')];
    }

    let _measureCtx = null;
    function getTextWidth(text, font) {
      try {
        if (!_measureCtx) {
          const c = document.createElement('canvas');
          _measureCtx = c.getContext('2d');
        }
        if (_measureCtx) {
          _measureCtx.font = font;
          return _measureCtx.measureText(text).width;
        }
      } catch (e) {}
      return (text || '').length * 9.5;
    }

    function wrapText(text, maxW, font) {
      if (!text) return [];
      // Dividir por párrafos (doble salto de línea: \n\n)
      const paragraphs = String(text).split(/\n\s*\n/);
      const result = [];
      paragraphs.forEach((p, pIdx) => {
        // Dentro de cada párrafo puede haber saltos de línea simples (\n)
        const subLines = p.split('\n');
        let firstLineInPara = true;
        subLines.forEach(lineText => {
          const words = lineText.trim().split(/\s+/);
          if (words.length === 0 || words[0] === '') return;
          let curLine = words[0];
          const wrapped = [];
          for (let i = 1; i < words.length; i++) {
            const testLine = curLine + ' ' + words[i];
            if (getTextWidth(testLine, font) <= maxW) {
              curLine = testLine;
            } else {
              wrapped.push(curLine);
              curLine = words[i];
            }
          }
          if (curLine) wrapped.push(curLine);
          wrapped.forEach(wLine => {
            result.push({ text: wLine, isNewParagraph: firstLineInPara && pIdx > 0 });
            firstLineInPara = false;
          });
        });
      });
      return result;
    }

    function buildSvg(recordData, exercisesData, periodStr, groupFilter, isExport = false) {
      if (!recordData || !recordData.athletes || !recordData.athletes.length) return null;

      const includeProfe = $('profeCheck').checked;
      const selectedGroup = groupFilter !== undefined ? groupFilter : currentGroup;

      const filteredAthletes = recordData.athletes.filter(a => {
        if (!includeProfe && a.es_profe) return false;
        if (selectedGroup !== 'all' && a.grupo !== selectedGroup) return false;
        return true;
      });
      if (!filteredAthletes.length) return null;

      // Determine exercises to display
      const exerciseDefs = (exercisesData && exercisesData.exercises) ? exercisesData.exercises : [];
      const exerciseMap = new Map(exerciseDefs.map(e => [e.id, e.name]));

      // Find all exercise IDs actually present in athletes' results
      const exerciseIds = [];
      exerciseDefs.forEach(e => {
        if (filteredAthletes.some(a => a.results && a.results[e.id] !== undefined && a.results[e.id] !== null)) {
          exerciseIds.push(e.id);
        }
      });
      filteredAthletes.forEach(a => {
        if (a.results) {
          Object.keys(a.results).forEach(id => {
            if (!exerciseIds.includes(id) && a.results[id] !== undefined && a.results[id] !== null) {
              exerciseIds.push(id);
            }
          });
        }
      });

      const cols = [];
      exerciseIds.forEach(id => {
        const h = exerciseMap.get(id) || id.replace(/_/g, ' ');
        const list = filteredAthletes.map(a => ({
          n: a.name,
          grupo: a.grupo || '',
          fecha: a.fecha || '',
          es_profe: !!a.es_profe,
          v: parseNum(a.results ? a.results[id] : undefined)
        })).filter(x => x.n && !isNaN(x.v));

        list.sort((a, b) => b.v - a.v);
        list.forEach((x, k) => {
          x.r = (k && list[k - 1].v === x.v) ? list[k - 1].r : k + 1;
        });

        if (list.length > 0) {
          cols.push({ id, h, list });
        }
      });

      if (!cols.length) return null;

      const CW = 250, GAP = 24, PAD = 36, RH = 58, PER = 4;
      const TOP = periodStr ? 172 : 154;
      const n = Math.min(cols.length, PER);
      const W = Math.max(750, PAD * 2 + n * CW + (n - 1) * GAP);
      let y = TOP, body = '';

      // --- 1. COLUMNAS DE LAS CATEGORÍAS INDIVIDUALES ---
      const chunks = [];
      for (let i = 0; i < cols.length; i += PER) chunks.push(cols.slice(i, i + PER));

      chunks.forEach((ch, ci) => {
        const mx = Math.max(...ch.map(c => c.list.length), 1);
        const ph = 84 + mx * RH + 10;
        const tw = ch.length * CW + (ch.length - 1) * GAP;
        const x0 = (W - tw) / 2;

        ch.forEach((c, k) => {
          const x = x0 + k * (CW + GAP);
          const col = COLORS[(ci * PER + k) % 4];
          body += `<rect x="${x}" y="${y}" width="${CW}" height="${ph}" rx="16" fill="#000" fill-opacity=".38" stroke="${col}" stroke-width="2.5"/>`;

          const sp = splitLeadingEmoji(c.h);
          const label = sp.text;
          body += sp.em
            ? `<text x="${x + 34}" y="${y + 45}" text-anchor="middle" font-size="30">${esc(sp.em)}</text>`
            : icon(c.h, x + 14, y + 14, col);

          const hl = wrap(label.toUpperCase());
          hl.forEach((t, j) => {
            body += `<text x="${x + 62}" y="${y + (hl.length > 1 ? 34 + j * 22 : 46)}" text-anchor="start" font-size="19" font-weight="800" font-style="italic" fill="#fff">${esc(t)}</text>`;
          });

          c.list.forEach((p, j) => {
            const yy = y + 76 + j * RH;
            const bx = x + 60;
            if (p.r <= 3) {
              body += `<circle cx="${x + 34}" cy="${yy + 25}" r="19" fill="${MEDAL[p.r]}" stroke="#fff" stroke-opacity=".5"/><text x="${x + 34}" y="${yy + 33}" text-anchor="middle" font-size="22" font-weight="800" fill="#1b1b1b">${p.r}</text>`;
            } else {
              body += `<text x="${x + 34}" y="${yy + 34}" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">${p.r}º</text>`;
            }

            const hi = p.r <= 3;
            body += `<rect x="${bx}" y="${yy}" width="176" height="50" rx="8" fill="#1a1d26" stroke="${hi ? col : '#3a4050'}" stroke-width="${hi ? 2 : 1.5}"/>`;
            body += `<rect x="${bx + 120}" y="${yy + 1}" width="55" height="48" rx="7" fill="#07080b"/>`;

            const showGroupBadge = (selectedGroup === 'all' && p.grupo);

            if (p.es_profe && showGroupBadge) {
              const fs = p.n.length > 8 ? 13 : p.n.length > 5 ? 15 : 17;
              body += `<text x="${bx + 60}" y="${yy + 20}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="#fff">${esc(p.n)}</text>`;
              const badgeY = yy + 28.5;
              const badge1W = 44, badge1X = bx + 10;
              body += `<rect x="${badge1X}" y="${badgeY}" width="${badge1W}" height="15" rx="7.5" fill="#ff8a2a" fill-opacity=".14" stroke="#ff8a2a" stroke-width="1" stroke-opacity=".75"/>`;
              body += `<text x="${badge1X + badge1W / 2}" y="${badgeY + 10.5}" text-anchor="middle" font-size="7.5" font-weight="900" fill="#ff9a47" letter-spacing="0.5">PROFE</text>`;

              const badge2W = 52, badge2X = bx + 58;
              body += `<rect x="${badge2X}" y="${badgeY}" width="${badge2W}" height="15" rx="7.5" fill="#38bdf8" fill-opacity=".14" stroke="#38bdf8" stroke-width="1" stroke-opacity=".75"/>`;
              body += `<text x="${badge2X + badge2W / 2}" y="${badgeY + 10.5}" text-anchor="middle" font-size="7.5" font-weight="900" fill="#7dd3fc" letter-spacing="0.5">${esc(p.grupo)}</text>`;
            } else if (p.es_profe) {
              const fs = p.n.length > 8 ? 14 : p.n.length > 5 ? 17 : 19;
              body += `<text x="${bx + 60}" y="${yy + 21}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="#fff">${esc(p.n)}</text>`;
              const badgeW = 48, badgeH = 15, badgeX = bx + 60 - badgeW / 2, badgeY = yy + 28.5;
              body += `<rect x="${badgeX}" y="${badgeY}" width="${badgeW}" height="${badgeH}" rx="7.5" fill="#ff8a2a" fill-opacity=".14" stroke="#ff8a2a" stroke-width="1" stroke-opacity=".75"/>`;
              body += `<text x="${bx + 60}" y="${badgeY + 10.5}" text-anchor="middle" font-size="8" font-weight="900" fill="#ff9a47" letter-spacing="0.8">PROFE</text>`;
            } else if (showGroupBadge) {
              const fs = p.n.length > 9 ? 14 : p.n.length > 6 ? 17 : 19;
              body += `<text x="${bx + 60}" y="${yy + 21}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="#fff">${esc(p.n)}</text>`;
              const badgeW = 56, badgeH = 15, badgeX = bx + 60 - badgeW / 2, badgeY = yy + 28.5;
              body += `<rect x="${badgeX}" y="${badgeY}" width="${badgeW}" height="${badgeH}" rx="7.5" fill="#38bdf8" fill-opacity=".14" stroke="#38bdf8" stroke-width="1" stroke-opacity=".75"/>`;
              body += `<text x="${bx + 60}" y="${badgeY + 10.5}" text-anchor="middle" font-size="8" font-weight="900" fill="#7dd3fc" letter-spacing="0.6">${esc(p.grupo)}</text>`;
            } else {
              const fs = p.n.length > 10 ? 15 : p.n.length > 6 ? 20 : 26;
              body += `<text x="${bx + 60}" y="${yy + 25 + fs * 0.35}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="#fff">${esc(p.n)}</text>`;
            }
            body += `<text x="${bx + 148}" y="${yy + 34}" text-anchor="middle" font-size="26" font-weight="800" fill="${col}">${esc(+p.v.toFixed(2))}</text>`;
          });
        });
        y += ph + GAP;
      });

      // --- 2. BLOQUE LEADERBOARD GENERAL (ABAJO) ---
      const rawCrit = window.SCORING_CRITERIA || { pos: { btnLabel: 'PUNTOS FIJOS' }, rel: { btnLabel: 'RELATIVO AL LÍDER' } };
      const allCrit = {};
      Object.keys(rawCrit).forEach(k => {
        const c = rawCrit[k];
        if (c && c.enabled !== false && c.activo !== false && c.habilitado !== false && !c.disabled) {
          allCrit[k] = c;
        }
      });

      const critKeys = Object.keys(allCrit);
      if (!allCrit[currentGmode] && critKeys.length > 0) {
        currentGmode = critKeys[0];
      }

      const gmode = currentGmode;
      const criteria = allCrit[gmode] || {
        btnLabel: gmode.toUpperCase(),
        cardTitle: 'POSICIONES GENERALES',
        ptsColumnHeader: 'PTS',
        getSubtitle: () => '',
        formatScore: pts => String(Math.round(pts)),
        calcExercisePoints: (entry, col, totalAthletes, totalExercises) => {
          const maxV = col.list[0] ? col.list[0].v : 0;
          return entry && maxV > 0 ? (totalAthletes - entry.r + 1) : 0;
        }
      };

      if (cols.length > 0) {
        const athletesMap = new Map();
        filteredAthletes.forEach(a => {
          if (a.name && !athletesMap.has(a.name)) {
            athletesMap.set(a.name, {
              es_profe: !!a.es_profe,
              grupo: a.grupo || '',
              fecha: a.fecha || ''
            });
          }
        });
        const totalAthletes = athletesMap.size;

        const glist = Array.from(athletesMap.entries()).map(([name, meta]) => {
          const reps = cols.map(c => {
            const entry = c.list.find(x => x.n === name);
            return entry ? { v: entry.v, r: entry.r } : null;
          });

          let pts = 0;
          if (typeof criteria.calcAthleteScore === 'function') {
            pts = criteria.calcAthleteScore(reps, cols, totalAthletes);
          } else {
            cols.forEach((c, idx) => {
              const entry = reps[idx];
              if (entry) {
                const gained = criteria.calcExercisePoints(entry, c, totalAthletes, cols.length);
                pts += gained;
              }
            });
          }
          return { n: name, es_profe: meta.es_profe, grupo: meta.grupo, fecha: meta.fecha, pts, reps };
        }).filter(x => x.pts > 0);

        glist.sort((a, b) => b.pts - a.pts);
        glist.forEach((x, k) => {
          x.r = (k && Math.abs(glist[k - 1].pts - x.pts) < 0.001) ? glist[k - 1].r : k + 1;
        });

        const GW = n * CW + (n - 1) * GAP;
        const gx0 = (W - GW) / 2;
        const GCOL = '#f5c542';
        const GR = 54;
        const sub = criteria.getSubtitle(totalAthletes, cols.length);

        // Más aire antes de POSICIONES GENERALES
        y += 55;
        body += `<text x="${W / 2}" y="${y + 36}" text-anchor="middle" font-size="36" font-weight="900" font-style="italic" fill="#fff">POSICIONES GENERALES</text>`;
        body += `<rect x="${W / 2 - 44}" y="${y + 50}" width="88" height="4" rx="2" fill="${GCOL}"/>`;
        // Subtítulo más angosto y contenido en el centro con interlineado de párrafo
        const maxSubW = Math.min(GW * 0.68, 700);
        const subLines = wrapText(sub, maxSubW, "14px 'Segoe UI', Arial, sans-serif");
        let curSubY = y + 78;
        subLines.forEach((item, sIdx) => {
          if (item.isNewParagraph) {
            curSubY += 12; // interlineado adicional de cambio de párrafo
          }
          body += `<text x="${W / 2}" y="${curSubY}" text-anchor="middle" font-size="14" fill="#9aa1b0">${esc(item.text)}</text>`;
          curSubY += 20; // interlineado dentro del mismo párrafo
        });

        // Espacio generoso entre el subtítulo y la tarjeta dorada
        const extraH = Math.max(0, curSubY - (y + 78) - 20);
        y += 114 + extraH;

        // Tarjeta con más aire vertical interno
        const gph = 150 + glist.length * GR + 14;
        body += `<rect x="${gx0}" y="${y}" width="${GW}" height="${gph}" rx="18" fill="#000" fill-opacity=".5" stroke="${GCOL}" stroke-width="3.5"/>`;
        body += `<text x="${gx0 + 42}" y="${y + 48}" text-anchor="middle" font-size="28">🏆</text>`;
        body += `<text x="${gx0 + 74}" y="${y + 47}" text-anchor="start" font-size="21" font-weight="900" font-style="italic" fill="${GCOL}">${esc(criteria.cardTitle)}</text>`;

        // Selector dinámico según los criterios disponibles (solo en vista interactiva, no en exportación)
        if (!isExport) {
          const btnGroupW = Math.min(GW - 360, Math.max(280, critKeys.length * 120));
          const btnGroupH = 34;
          const btnGroupX = gx0 + GW - 24 - btnGroupW;
          const btnGroupY = y + 25;
          const btnW = btnGroupW / Math.max(critKeys.length, 1);

          body += `<g class="svg-seg" transform="translate(${btnGroupX}, ${btnGroupY})">
            <rect width="${btnGroupW}" height="${btnGroupH}" rx="8" fill="#0d0f14" stroke="#3a4050" stroke-width="1.5"/>`;

          critKeys.forEach((key, idx) => {
            const isSel = gmode === key;
            const crit = allCrit[key];
            const bx = idx * btnW;
            const fs = btnW < 95 ? 9 : (btnW < 110 ? 10 : (btnW < 125 ? 10.5 : 11));
            const ls = btnW < 110 ? 0.2 : 0.5;
            body += `<g class="svg-mode-btn" data-mode="${esc(key)}">
              <rect x="${bx + 2}" y="2" width="${btnW - 4}" height="${btnGroupH - 4}" rx="6" fill="${isSel ? '#f5c542' : 'transparent'}"/>
              <text x="${bx + btnW / 2}" y="21" text-anchor="middle" font-size="${fs}" font-weight="${isSel ? '800' : '600'}" fill="${isSel ? '#1a1005' : '#9aa1b0'}" letter-spacing="${ls}">${esc(crit.btnLabel || key.toUpperCase())}</text>
            </g>`;
          });

          body += `</g>`;
        }

        const rowX = gx0 + 24;
        const rowW = GW - 48;
        const ptsW = 105;
        const nameW = Math.min(260, Math.max(160, Math.floor(rowW * 0.28)));
        const exAreaW = rowW - nameW - ptsW;
        const exW = cols.length > 0 ? exAreaW / cols.length : 0;

        // Línea divisoria elegante que separa la cabecera (título y selector) de las columnas
        body += `<line x1="${rowX}" y1="${y + 78}" x2="${rowX + rowW}" y2="${y + 78}" stroke="#2a303f" stroke-width="1.2"/>`;

        // Encabezados de columnas con amplio espacio vertical (muy separado del selector superior)
        const colHeaderY = y + 108;
        cols.forEach((c, ci) => {
          const cx = rowX + nameW + ci * exW + exW / 2;
          const fs = exW < 100 ? 10 : 12;
          const mc = Math.max(5, Math.floor(exW / (fs * 0.68)));
          const lines = splitMid(splitLeadingEmoji(c.h).text.toUpperCase()).map(t => t.length > mc ? t.slice(0, mc - 1) + '.' : t);
          lines.forEach((t, j) => {
            body += `<text x="${cx}" y="${(lines.length > 1 ? colHeaderY - 7 : colHeaderY) + j * 15}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="${COLORS[ci % 4]}" letter-spacing="0.5">${esc(t)}</text>`;
          });
        });

        body += `<text x="${rowX + rowW - ptsW / 2}" y="${colHeaderY}" text-anchor="middle" font-size="12" font-weight="900" fill="${GCOL}" letter-spacing="0.5">${esc(criteria.ptsColumnHeader || 'PTS')}</text>`;

        // Filas de atletas con inicio amplio
        glist.forEach((p, j) => {
          const yy = y + 138 + j * GR;
          const hi = p.r <= 3;
          const rowBg = j % 2 === 0 ? '#141720' : '#11141b';

          body += `<rect x="${rowX}" y="${yy}" width="${rowW}" height="46" rx="7" fill="${rowBg}" stroke="${hi ? MEDAL[p.r] : '#222733'}" stroke-width="${hi ? 1.5 : 1}"/>`;

          if (hi) {
            body += `<circle cx="${rowX + 23}" cy="${yy + 23}" r="15" fill="${MEDAL[p.r]}" stroke="#fff" stroke-opacity=".4"/>`;
            body += `<text x="${rowX + 23}" y="${yy + 29}" text-anchor="middle" font-size="16" font-weight="800" fill="#1b1b1b">${p.r}</text>`;
          } else {
            body += `<text x="${rowX + 23}" y="${yy + 29}" text-anchor="middle" font-size="16" font-weight="700" fill="#8b93a6">${p.r}º</text>`;
          }

          body += `<text x="${rowX + 54}" y="${yy + 29}" text-anchor="start" font-size="17" font-weight="700" fill="#fff">${esc(p.n)}</text>`;
          const nw = getTextWidth(p.n, "700 17px 'Segoe UI', Arial, sans-serif");
          let curBadgeX = rowX + 54 + Math.round(nw) + 10;

          if (p.es_profe) {
            const badgeW = 46, badgeH = 17, badgeY = yy + 14.5;
            body += `<rect x="${curBadgeX}" y="${badgeY}" width="${badgeW}" height="${badgeH}" rx="8.5" fill="#ff8a2a" fill-opacity=".14" stroke="#ff8a2a" stroke-width="1" stroke-opacity=".75"/>`;
            body += `<text x="${curBadgeX + badgeW / 2}" y="${badgeY + 12}" text-anchor="middle" font-size="8.5" font-weight="900" fill="#ff9a47" letter-spacing="0.8">PROFE</text>`;
            curBadgeX += badgeW + 6;
          }

          if (selectedGroup === 'all' && p.grupo) {
            const gw = Math.max(50, Math.round(getTextWidth(p.grupo, "900 8.5px 'Segoe UI', Arial, sans-serif") + 16));
            const badgeH = 17, badgeY = yy + 14.5;
            body += `<rect x="${curBadgeX}" y="${badgeY}" width="${gw}" height="${badgeH}" rx="8.5" fill="#38bdf8" fill-opacity=".14" stroke="#38bdf8" stroke-width="1" stroke-opacity=".75"/>`;
            body += `<text x="${curBadgeX + gw / 2}" y="${badgeY + 12}" text-anchor="middle" font-size="8.5" font-weight="900" fill="#7dd3fc" letter-spacing="0.8">${esc(p.grupo)}</text>`;
          }

          p.reps.forEach((rep, ci) => {
            const cellX = rowX + nameW + ci * exW;
            const cx = cellX + exW / 2;
            if (rep) {
              const rStr = `${+rep.v.toFixed(1)}`;
              body += `<text x="${cx}" y="${yy + 29}" text-anchor="middle" font-size="15" font-weight="600" fill="#9aa1b0">${esc(rStr)}</text>`;
            } else {
              body += `<text x="${cx}" y="${yy + 29}" text-anchor="middle" font-size="15" font-weight="600" fill="#444">-</text>`;
            }
          });

          const ptsX = rowX + rowW - ptsW;
          const valStr = criteria.formatScore ? criteria.formatScore(p.pts) : String(Math.round(p.pts));
          body += `<text x="${ptsX + ptsW / 2}" y="${yy + 30}" text-anchor="middle" font-size="20" font-weight="900" fill="${GCOL}">${esc(valStr)}</text>`;
        });

        y += gph + GAP + 6;
      }

      const H = y - GAP + 34;
      const baseLabel = (recordData && (recordData.nombre || recordData.name)) ? (recordData.nombre || recordData.name) : (periodStr || '');
      let periodLabel = baseLabel ? `EVALUACIÓN: ${baseLabel}` : '';
      if (selectedGroup !== 'all') {
        periodLabel = periodLabel ? `${periodLabel} · GRUPO: ${selectedGroup}` : `GRUPO: ${selectedGroup}`;
      } else if (recordData && recordData.athletes && recordData.athletes.some(a => a.grupo)) {
        periodLabel = periodLabel ? `${periodLabel} · TODOS LOS GRUPOS` : 'TODOS LOS GRUPOS';
      }

      const head = `<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f2b"/>
      <stop offset=".5" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
  </defs>
  <rect width="${W}" height="${H}" fill="url(#bg)"/>
  <text x="${W / 2}" y="64" text-anchor="middle" font-size="38" font-weight="900" font-style="italic" fill="#ff8a2a">MÁXIMOS - CALISTENIA</text>
  <text x="${W / 2}" y="110" text-anchor="middle" font-size="44" font-weight="900" font-style="italic" fill="#fff">RANKING POR EJERCICIO</text>
  ${periodLabel ? `<text x="${W / 2}" y="145" text-anchor="middle" font-size="15" font-weight="800" fill="#9aa1b0" letter-spacing="1.5">${esc(periodLabel.toUpperCase())}</text>` : ''}`;

      return {
        svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">${head}${body}</svg>`,
        W,
        H
      };
    }

    function render() {
      try {
        if (!currentRecord) {
          $('prev').innerHTML = '<div class="status-msg error">No hay registros disponibles para el período seleccionado.</div>';
          curSvg = null;
          return;
        }
        curSvg = buildSvg(currentRecord, exercisesConfig, currentPeriod, currentGroup);
        if (curSvg) {
          $('prev').innerHTML = curSvg.svg;
        } else {
          $('prev').innerHTML = '<div class="status-msg">No se encontraron atletas o ejercicios para los filtros seleccionados.</div>';
        }
      } catch (e) {
        $('prev').innerHTML = `<div class="status-msg error">Error al procesar los datos: ${esc(e.message)}</div>`;
      }
    }

    async function loadPeriodData(period) {
      currentPeriod = period;
      $('prev').innerHTML = `
    <div class="status-msg loading">
      <div class="spinner"></div>
      <span>Cargando datos del período ${esc(period)}...</span>
    </div>
  `;

      try {
        const res = await fetch(`data/registros/${period}.json`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        currentRecord = await res.json();
        updateGroupFilter(currentRecord.athletes);
        render();
      } catch (err) {
        console.warn(`Error al obtener data/registros/${period}.json via fetch:`, err);
        if (period === "2026-10" || period === "2026-10-19") {
          currentRecord = FALLBACK_RECORD;
          updateGroupFilter(currentRecord.athletes);
          render();
        } else {
          $('prev').innerHTML = `<div class="status-msg error">No se pudo cargar el archivo data/registros/${esc(period)}.json (${esc(err.message)})</div>`;
        }
      }
    }

    async function init() {
      // Load exercises definition
      try {
        const exRes = await fetch('data/ejercicios.json');
        if (exRes.ok) {
          exercisesConfig = await exRes.json();
        } else {
          exercisesConfig = FALLBACK_EXERCISES;
        }
      } catch (e) {
        exercisesConfig = FALLBACK_EXERCISES;
      }

      // Load period list
      try {
        const perRes = await fetch('data/periodos.json');
        if (perRes.ok) {
          availablePeriods = await perRes.json();
        } else {
          availablePeriods = FALLBACK_PERIODS;
        }
      } catch (e) {
        availablePeriods = FALLBACK_PERIODS;
      }

      if (!availablePeriods || !availablePeriods.length) {
        availablePeriods = FALLBACK_PERIODS;
      }

      // Populate select dropdown
      const select = $('periodSelect');
      select.innerHTML = '';
      availablePeriods.forEach(p => {
        const id = typeof p === 'object' && p.id ? p.id : String(p);
        const name = typeof p === 'object' && (p.nombre || p.name) ? (p.nombre || p.name) : id;
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = name;
        select.appendChild(opt);
      });

      // Select the last period by default
      const defaultObj = availablePeriods[availablePeriods.length - 1];
      const defaultPeriod = typeof defaultObj === 'object' && defaultObj.id ? defaultObj.id : String(defaultObj);
      select.value = defaultPeriod;

      // Listeners
      select.addEventListener('change', () => loadPeriodData(select.value));
      $('groupSelect').addEventListener('change', (e) => {
        currentGroup = e.target.value;
        render();
      });
      $('profeCheck').addEventListener('change', render);

      // Listener para el selector de sistema de puntaje dentro del SVG
      $('prev').addEventListener('click', e => {
        const btn = e.target.closest('[data-mode]');
        if (!btn) return;
        const newMode = btn.dataset.mode;
        if (newMode && newMode !== currentGmode) {
          currentGmode = newMode;
          render();
        }
      });

      // Export Dropdown
      const exportBtn = $('exportBtn');
      const exportMenu = $('exportMenu');

      exportBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = exportMenu.classList.toggle('show');
        exportBtn.setAttribute('aria-expanded', isOpen);
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.export-dropdown')) {
          exportMenu.classList.remove('show');
          exportBtn.setAttribute('aria-expanded', 'false');
        }
      });

      // Download buttons
      function dl(blob, name) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }

      function getExportFilename(ext) {
        const pStr = currentPeriod || 'export';
        const gStr = currentGroup !== 'all' ? `-${currentGroup}` : '';
        return `leaderboard-${pStr}${gStr}.${ext}`;
      }

      function getCleanExportSvg() {
        return buildSvg(currentRecord, exercisesConfig, currentPeriod, currentGroup, true);
      }

      $('svgBtn').onclick = () => {
        exportMenu.classList.remove('show');
        exportBtn.setAttribute('aria-expanded', 'false');
        const expSvg = getCleanExportSvg();
        if (expSvg) {
          dl(new Blob([expSvg.svg], { type: 'image/svg+xml' }), getExportFilename('svg'));
        }
      };

      $('pngBtn').onclick = () => {
        exportMenu.classList.remove('show');
        exportBtn.setAttribute('aria-expanded', 'false');
        const expSvg = getCleanExportSvg();
        if (!expSvg) return;
        const s = expSvg.svg.replace('<svg ', `<svg width="${expSvg.W}" height="${expSvg.H}" `);
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          c.width = expSvg.W * 2;
          c.height = expSvg.H * 2;
          const x = c.getContext('2d');
          x.scale(2, 2);
          x.drawImage(img, 0, 0, expSvg.W, expSvg.H);
          c.toBlob(b => dl(b, getExportFilename('png')));
        };
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
      };

      $('pdfBtn').onclick = () => {
        exportMenu.classList.remove('show');
        exportBtn.setAttribute('aria-expanded', 'false');
        const expSvg = getCleanExportSvg();
        if (!expSvg) return;

        const s = expSvg.svg.replace('<svg ', `<svg width="${expSvg.W}" height="${expSvg.H}" `);
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          c.width = expSvg.W * 2;
          c.height = expSvg.H * 2;
          const x = c.getContext('2d');
          x.scale(2, 2);
          x.drawImage(img, 0, 0, expSvg.W, expSvg.H);

          const imgData = c.toDataURL('image/png');
          const orientation = expSvg.W > expSvg.H ? 'l' : 'p';
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({
            orientation,
            unit: 'px',
            format: [expSvg.W, expSvg.H]
          });

          pdf.addImage(imgData, 'PNG', 0, 0, expSvg.W, expSvg.H);
          pdf.save(getExportFilename('pdf'));
        };
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
      };

      // Load the initial period
      await loadPeriodData(defaultPeriod);
    }

    init();
  </script>
</body>

</html>
